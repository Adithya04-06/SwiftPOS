<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#F8FAFC" />
  
  <text x="120" y="160" font-family="Inter, sans-serif" font-size="64" font-weight="bold" fill="#0F172A">Checkout Workflow</text>
  <rect x="120" y="200" width="100" height="8" rx="4" fill="#2563EB" />
  
  <g transform="translate(200, 400)">
    <!-- Box 1 -->
    <rect width="250" height="150" rx="12" fill="#2563EB" />
    <text x="125" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Scan / Search</text>
    <text x="125" y="100" font-family="Inter, sans-serif" font-size="16" fill="#BFDBFE" text-anchor="middle">Product</text>
    
    <!-- Arrow 1 -->
    <path d="M 270 75 L 380 75" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8" fill="none" />
    <polygon points="380,65 400,75 380,85" fill="#94A3B8" />
    
    <!-- Box 2 -->
    <rect x="420" y="0" width="250" height="150" rx="12" fill="#2563EB" />
    <text x="545" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Add to Cart</text>
    <text x="545" y="100" font-family="Inter, sans-serif" font-size="16" fill="#BFDBFE" text-anchor="middle">Adjust Quantity</text>
    
    <!-- Arrow 2 -->
    <path d="M 690 75 L 800 75" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8" fill="none" />
    <polygon points="800,65 820,75 800,85" fill="#94A3B8" />
    
    <!-- Box 3 -->
    <rect x="840" y="0" width="250" height="150" rx="12" fill="#2563EB" />
    <text x="965" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Payment</text>
    <text x="965" y="100" font-family="Inter, sans-serif" font-size="16" fill="#BFDBFE" text-anchor="middle">Select Method</text>
    
    <!-- Arrow 3 -->
    <path d="M 1110 75 L 1220 75" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8" fill="none" />
    <polygon points="1220,65 1240,75 1220,85" fill="#94A3B8" />
    
    <!-- Box 4 -->
    <rect x="1260" y="0" width="250" height="150" rx="12" fill="#16A34A" />
    <text x="1385" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Receipt</text>
    <text x="1385" y="100" font-family="Inter, sans-serif" font-size="16" fill="#DCFCE7" text-anchor="middle">Complete Sale</text>
  </g>
</svg>
