<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#F8FAFC" />
  
  <text x="120" y="160" font-family="Inter, sans-serif" font-size="64" font-weight="bold" fill="#0F172A">System Architecture</text>
  <rect x="120" y="200" width="100" height="8" rx="4" fill="#2563EB" />
  
  <!-- Diagram -->
  <g transform="translate(200, 350)">
    <!-- Frontend -->
    <rect width="350" height="300" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" />
    <text x="175" y="80" font-family="Inter, sans-serif" font-size="32" font-weight="bold" fill="#0F172A" text-anchor="middle">Frontend</text>
    <rect x="45" y="120" width="260" height="60" rx="8" fill="#EFF6FF" />
    <text x="175" y="157" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#2563EB" text-anchor="middle">React 19 + Vite</text>
    <rect x="45" y="200" width="260" height="60" rx="8" fill="#EFF6FF" />
    <text x="175" y="237" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#2563EB" text-anchor="middle">React Router</text>
    
    <!-- Arrow -->
    <path d="M 360 150 L 520 150" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8" fill="none" />
    <polygon points="520,140 540,150 520,160" fill="#94A3B8" />
    <text x="450" y="130" font-family="Inter, sans-serif" font-size="16" fill="#64748B" text-anchor="middle">REST API (JSON)</text>
    
    <path d="M 540 180 L 380 180" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8" fill="none" />
    <polygon points="380,170 360,180 380,190" fill="#94A3B8" />
    
    <!-- Backend -->
    <rect x="560" y="0" width="350" height="300" rx="16" fill="#FFFFFF" stroke="#16A34A" stroke-width="4" />
    <text x="735" y="80" font-family="Inter, sans-serif" font-size="32" font-weight="bold" fill="#0F172A" text-anchor="middle">Backend API</text>
    <rect x="605" y="120" width="260" height="60" rx="8" fill="#DCFCE7" />
    <text x="735" y="157" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#16A34A" text-anchor="middle">Java Spring Boot 3</text>
    <rect x="605" y="200" width="260" height="60" rx="8" fill="#DCFCE7" />
    <text x="735" y="237" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#16A34A" text-anchor="middle">Spring Data JPA</text>
    
    <!-- Arrow -->
    <path d="M 920 150 L 1100 150" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8" fill="none" />
    <polygon points="1100,140 1120,150 1100,160" fill="#94A3B8" />
    <text x="1020" y="130" font-family="Inter, sans-serif" font-size="16" fill="#64748B" text-anchor="middle">JDBC</text>
    
    <path d="M 1120 180 L 940 180" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8" fill="none" />
    <polygon points="940,170 920,180 940,190" fill="#94A3B8" />
    
    <!-- Database -->
    <rect x="1140" y="0" width="350" height="300" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4" />
    <text x="1315" y="80" font-family="Inter, sans-serif" font-size="32" font-weight="bold" fill="#0F172A" text-anchor="middle">Database</text>
    <rect x="1185" y="120" width="260" height="140" rx="8" fill="#FEF3C7" />
    <text x="1315" y="180" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#D97706" text-anchor="middle">MySQL</text>
    <text x="1315" y="220" font-family="Inter, sans-serif" font-size="16" fill="#D97706" text-anchor="middle">Relational Data</text>
  </g>
</svg>
