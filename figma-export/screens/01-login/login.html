<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPOS - Login</title>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #F8FAFC; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #FFFFFF; width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #E2E8F0; }
        .logo { font-size: 24px; font-weight: bold; color: #2563EB; text-align: center; margin-bottom: 24px; }
        h1 { font-size: 24px; color: #0F172A; text-align: center; margin: 0 0 8px 0; }
        p { color: #64748B; text-align: center; font-size: 14px; margin: 0 0 32px 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #0F172A; margin-bottom: 8px; font-weight: 500; }
        input[type="email"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 14px; color: #64748B; }
        .btn-primary { width: 100%; padding: 12px; background-color: #2563EB; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">SwiftPOS</div>
        <h1>Welcome back</h1>
        <p>Sign in to your SwiftPOS account</p>
        <div class="form-group">
            <label>Email</label>
            <input type="email" value="admin@swiftpos.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" value="********">
        </div>
        <div class="options">
            <label style="font-weight:normal; display:flex; align-items:center; gap:8px;">
                <input type="checkbox" checked> Remember me
            </label>
            <a href="#" style="color:#2563EB; text-decoration:none;">Forgot password?</a>
        </div>
        <button class="btn-primary">Sign In</button>
    </div>
</body>
</html>
