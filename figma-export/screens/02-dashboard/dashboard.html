<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPOS - Dashboard</title>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #F8FAFC; display: flex; height: 100vh; }
        .sidebar { width: 240px; background: #0F172A; color: #fff; padding: 24px; box-sizing: border-box; }
        .sidebar .logo { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 40px; }
        .nav-item { padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; color: #94A3B8; }
        .nav-item.active { background: #1E293B; color: #fff; }
        .main-content { flex: 1; padding: 32px; box-sizing: border-box; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { margin: 0; font-size: 24px; color: #0F172A; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 32px; }
        .kpi-card { background: #fff; padding: 24px; border-radius: 12px; border: 1px solid #E2E8F0; }
        .kpi-card h3 { margin: 0 0 8px 0; font-size: 14px; color: #64748B; font-weight: 500; }
        .kpi-card .value { font-size: 28px; font-weight: bold; color: #0F172A; }
        .charts-container { display: flex; gap: 24px; }
        .chart-card { flex: 2; background: #fff; padding: 24px; border-radius: 12px; border: 1px solid #E2E8F0; height: 300px; }
        .recent-card { flex: 1; background: #fff; padding: 24px; border-radius: 12px; border: 1px solid #E2E8F0; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">SwiftPOS</div>
        <div class="nav-item active">Dashboard</div>
        <div class="nav-item">POS</div>
        <div class="nav-item">Products</div>
        <div class="nav-item">Inventory</div>
        <div class="nav-item">Sales History</div>
        <div class="nav-item">Settings</div>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>Dashboard</h1>
            <div style="background:#fff; padding:8px 16px; border-radius:20px; border:1px solid #E2E8F0; font-size:14px; color:#0F172A;">Admin User</div>
        </div>
        <div class="kpi-grid">
            <div class="kpi-card"><h3>Today's Sales</h3><div class="value">₹45,200</div></div>
            <div class="kpi-card"><h3>Transactions</h3><div class="value">128</div></div>
            <div class="kpi-card"><h3>Products Active</h3><div class="value">84</div></div>
            <div class="kpi-card"><h3>Low Stock Items</h3><div class="value" style="color:#F59E0B;">5</div></div>
        </div>
        <div class="charts-container">
            <div class="chart-card">
                <h3 style="margin:0 0 24px 0; color:#0F172A; font-size:16px;">Sales Overview</h3>
                <div style="height:200px; background:linear-gradient(180deg, rgba(37,99,235,0.1) 0%, rgba(37,99,235,0) 100%); border-bottom:2px solid #2563EB; position:relative;">
                    <!-- Mock chart line -->
                    <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path d="M0 80 Q 20 60, 40 70 T 80 40 T 100 20" fill="none" stroke="#2563EB" stroke-width="2"/>
                    </svg>
                </div>
            </div>
            <div class="recent-card">
                <h3 style="margin:0 0 16px 0; color:#0F172A; font-size:16px;">Recent Transactions</h3>
                <div style="font-size:14px;">
                    <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #E2E8F0;"><span>#TRX-001</span><strong>₹1,200</strong></div>
                    <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #E2E8F0;"><span>#TRX-002</span><strong>₹5,500</strong></div>
                    <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #E2E8F0;"><span>#TRX-003</span><strong>₹300</strong></div>
                    <div style="display:flex; justify-content:space-between; padding:12px 0;"><span>#TRX-004</span><strong>₹15,000</strong></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
