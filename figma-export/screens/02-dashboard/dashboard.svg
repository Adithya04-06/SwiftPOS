<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#F8FAFC" />
  
  <!-- Sidebar -->
  <rect width="240" height="900" fill="#0F172A" />
  <text x="24" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">SwiftPOS</text>
  
  <g transform="translate(16, 80)">
    <rect width="208" height="40" rx="8" fill="#1E293B" />
    <text x="16" y="25" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF">Dashboard</text>
    
    <text x="16" y="73" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">POS</text>
    <text x="16" y="121" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Products</text>
    <text x="16" y="169" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Inventory</text>
    <text x="16" y="217" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Sales History</text>
    <text x="16" y="265" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(240, 0)">
    <!-- Header -->
    <text x="32" y="60" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Dashboard</text>
    <rect x="1030" y="36" width="138" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="1099" y="61" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">Admin User</text>
    
    <!-- KPI Cards -->
    <g transform="translate(32, 100)">
      <!-- Card 1 -->
      <rect width="265" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">Today's Sales</text>
      <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">₹45,200</text>
      
      <!-- Card 2 -->
      <g transform="translate(289, 0)">
        <rect width="265" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">Transactions</text>
        <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">128</text>
      </g>
      
      <!-- Card 3 -->
      <g transform="translate(578, 0)">
        <rect width="265" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">Products Active</text>
        <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">84</text>
      </g>
      
      <!-- Card 4 -->
      <g transform="translate(867, 0)">
        <rect width="269" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">Low Stock Items</text>
        <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#F59E0B">5</text>
      </g>
    </g>

    <!-- Charts area -->
    <g transform="translate(32, 232)">
      <rect width="770" height="350" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="24" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Sales Overview</text>
      <path d="M 24 300 Q 200 200, 400 250 T 740 100" fill="none" stroke="#2563EB" stroke-width="3" />
      
      <rect x="794" y="0" width="342" height="350" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="818" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Recent Transactions</text>
      
      <g transform="translate(818, 60)">
        <rect width="294" height="1" fill="#E2E8F0" y="40"/>
        <text y="24" font-family="Inter, sans-serif" font-size="14" fill="#64748B">#TRX-001</text>
        <text x="294" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="end">₹1,200</text>
        
        <rect width="294" height="1" fill="#E2E8F0" y="90"/>
        <text y="74" font-family="Inter, sans-serif" font-size="14" fill="#64748B">#TRX-002</text>
        <text x="294" y="74" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="end">₹5,500</text>
        
        <rect width="294" height="1" fill="#E2E8F0" y="140"/>
        <text y="124" font-family="Inter, sans-serif" font-size="14" fill="#64748B">#TRX-003</text>
        <text x="294" y="124" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="end">₹300</text>
      </g>
    </g>
  </g>
</svg>
