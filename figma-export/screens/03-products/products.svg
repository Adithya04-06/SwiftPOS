<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#F8FAFC" />
  
  <!-- Sidebar -->
  <rect width="240" height="900" fill="#0F172A" />
  <text x="24" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">SwiftPOS</text>
  
  <g transform="translate(16, 80)">
    <text x="16" y="25" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Dashboard</text>
    <text x="16" y="73" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">POS</text>
    
    <rect y="104" width="208" height="40" rx="8" fill="#1E293B" />
    <text x="16" y="129" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF">Products</text>
    
    <text x="16" y="177" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Inventory</text>
    <text x="16" y="225" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Sales History</text>
    <text x="16" y="273" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(240, 0)">
    <!-- Header -->
    <text x="32" y="60" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Products</text>
    
    <rect x="718" y="32" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="734" y="59" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Search products...</text>
    
    <rect x="1034" y="32" width="134" height="44" rx="8" fill="#2563EB" />
    <text x="1101" y="59" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Add Product</text>

    <!-- Table -->
    <g transform="translate(32, 108)">
      <rect width="1136" height="400" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <!-- Header Row -->
      <rect y="1" width="1136" height="48" fill="#F8FAFC" />
      <path d="M 0 49 L 1136 49" stroke="#E2E8F0" stroke-width="1" fill="none" />
      
      <text x="24" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Product</text>
      <text x="350" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Category</text>
      <text x="550" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Price</text>
      <text x="700" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Stock</text>
      <text x="850" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Status</text>
      <text x="1050" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Actions</text>

      <!-- Row 1 -->
      <path d="M 0 119 L 1136 119" stroke="#E2E8F0" stroke-width="1" fill="none" />
      <text x="24" y="80" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Laptop XPS 15</text>
      <text x="24" y="100" font-family="Inter, sans-serif" font-size="12" fill="#64748B">SKU: LAP-001</text>
      <text x="350" y="90" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Electronics</text>
      <text x="550" y="90" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">₹1,20,000</text>
      <text x="700" y="90" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">15</text>
      <rect x="850" y="74" width="70" height="24" rx="12" fill="#DCFCE7" />
      <text x="885" y="91" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16A34A" text-anchor="middle">In Stock</text>
      <text x="1050" y="90" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Edit</text>
      <text x="1090" y="90" font-family="Inter, sans-serif" font-size="14" fill="#DC2626">Delete</text>

      <!-- Row 2 -->
      <path d="M 0 189 L 1136 189" stroke="#E2E8F0" stroke-width="1" fill="none" />
      <text x="24" y="150" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Wireless Mouse</text>
      <text x="24" y="170" font-family="Inter, sans-serif" font-size="12" fill="#64748B">SKU: MOU-001</text>
      <text x="350" y="160" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Accessories</text>
      <text x="550" y="160" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">₹1,500</text>
      <text x="700" y="160" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">50</text>
      <rect x="850" y="144" width="70" height="24" rx="12" fill="#DCFCE7" />
      <text x="885" y="161" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16A34A" text-anchor="middle">In Stock</text>
      <text x="1050" y="160" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Edit</text>
      <text x="1090" y="160" font-family="Inter, sans-serif" font-size="14" fill="#DC2626">Delete</text>

      <!-- Row 3 -->
      <path d="M 0 259 L 1136 259" stroke="#E2E8F0" stroke-width="1" fill="none" />
      <text x="24" y="220" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Webcam HD</text>
      <text x="24" y="240" font-family="Inter, sans-serif" font-size="12" fill="#64748B">SKU: WEB-001</text>
      <text x="350" y="230" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Electronics</text>
      <text x="550" y="230" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">₹3,500</text>
      <text x="700" y="230" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">2</text>
      <rect x="850" y="214" width="80" height="24" rx="12" fill="#FEF3C7" />
      <text x="890" y="231" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#D97706" text-anchor="middle">Low Stock</text>
      <text x="1050" y="230" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Edit</text>
      <text x="1090" y="230" font-family="Inter, sans-serif" font-size="14" fill="#DC2626">Delete</text>

      <!-- Row 4 -->
      <path d="M 0 329 L 1136 329" stroke="#E2E8F0" stroke-width="1" fill="none" />
      <text x="24" y="290" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Bluetooth Speaker</text>
      <text x="24" y="310" font-family="Inter, sans-serif" font-size="12" fill="#64748B">SKU: SPK-001</text>
      <text x="350" y="300" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Audio</text>
      <text x="550" y="300" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">₹4,000</text>
      <text x="700" y="300" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">0</text>
      <rect x="850" y="284" width="90" height="24" rx="12" fill="#FEE2E2" />
      <text x="895" y="301" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#DC2626" text-anchor="middle">Out of Stock</text>
      <text x="1050" y="300" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Edit</text>
      <text x="1090" y="300" font-family="Inter, sans-serif" font-size="14" fill="#DC2626">Delete</text>
    </g>
  </g>
</svg>
