<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#F8FAFC" />
  
  <!-- Sidebar -->
  <rect width="240" height="900" fill="#0F172A" />
  <text x="24" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">SwiftPOS</text>
  
  <g transform="translate(16, 80)">
    <text x="16" y="25" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Dashboard</text>
    <text x="16" y="73" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">POS</text>
    
    <rect y="104" width="208" height="40" rx="8" fill="#1E293B" />
    <text x="16" y="129" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF">Products</text>
    
    <text x="16" y="177" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Inventory</text>
    <text x="16" y="225" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Sales History</text>
    <text x="16" y="273" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Settings</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(240, 0)">
    <!-- Header -->
    <text x="32" y="60" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Add New Product</text>

    <!-- Form Card -->
    <rect x="32" y="108" width="600" height="520" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
    
    <g transform="translate(64, 140)">
      <!-- Name -->
      <text y="14" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Product Name</text>
      <rect y="22" width="536" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="49" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">e.g. Wireless Mouse</text>
      
      <!-- SKU & Category -->
      <text y="94" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">SKU (Stock Keeping Unit)</text>
      <rect y="102" width="256" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="129" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">e.g. MOU-002</text>
      
      <text x="280" y="94" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Category</text>
      <rect x="280" y="102" width="256" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="296" y="129" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Electronics</text>
      
      <!-- Price & Stock -->
      <text y="174" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Price (₹)</text>
      <rect y="182" width="256" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="209" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">0.00</text>
      
      <text x="280" y="174" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Initial Stock Quantity</text>
      <rect x="280" y="182" width="256" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="296" y="209" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">0</text>
      
      <!-- Threshold -->
      <text y="254" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Low Stock Threshold</text>
      <rect y="262" width="256" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="289" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">5</text>
      
      <!-- Actions -->
      <rect y="338" width="536" height="1" fill="#E2E8F0" />
      
      <rect x="256" y="362" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="321" y="389" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Cancel</text>
      
      <rect x="402" y="362" width="134" height="44" rx="8" fill="#2563EB" />
      <text x="469" y="389" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Save Product</text>
    </g>
  </g>
</svg>
