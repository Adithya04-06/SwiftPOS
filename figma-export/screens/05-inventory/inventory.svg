<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#F8FAFC" />
  
  <!-- Sidebar -->
  <rect width="240" height="900" fill="#0F172A" />
  <text x="24" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">SwiftPOS</text>
  
  <g transform="translate(16, 80)">
    <text x="16" y="25" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Dashboard</text>
    <text x="16" y="73" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">POS</text>
    <text x="16" y="121" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Products</text>
    
    <rect y="152" width="208" height="40" rx="8" fill="#1E293B" />
    <text x="16" y="177" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF">Inventory</text>
    
    <text x="16" y="225" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Sales History</text>
    <text x="16" y="273" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(240, 0)">
    <!-- Header -->
    <text x="32" y="60" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Inventory Management</text>
    <rect x="1060" y="32" width="108" height="40" rx="8" fill="#2563EB" />
    <text x="1114" y="57" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Export CSV</text>
    
    <!-- KPI Cards -->
    <g transform="translate(32, 100)">
      <rect width="265" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">Total Products</text>
      <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">124</text>
      
      <g transform="translate(289, 0)">
        <rect width="265" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">In Stock</text>
        <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#16A34A">110</text>
      </g>
      
      <g transform="translate(578, 0)">
        <rect width="265" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">Low Stock</text>
        <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#D97706">9</text>
      </g>
      
      <g transform="translate(867, 0)">
        <rect width="269" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B">Out of Stock</text>
        <text x="24" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#DC2626">5</text>
      </g>
    </g>

    <!-- Actions -->
    <g transform="translate(32, 232)">
      <rect width="300" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="27" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Search by SKU or Name...</text>
      
      <rect x="316" y="0" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="376" y="27" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">Status: All</text>
      
      <rect x="452" y="0" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="522" y="27" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">Category: All</text>
    </g>

    <!-- Table -->
    <g transform="translate(32, 300)">
      <rect width="1136" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <rect y="1" width="1136" height="48" fill="#F8FAFC" />
      <path d="M 0 49 L 1136 49" stroke="#E2E8F0" stroke-width="1" fill="none" />
      
      <text x="24" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">SKU</text>
      <text x="200" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Product Name</text>
      <text x="450" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Current Stock</text>
      <text x="650" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Min Threshold</text>
      <text x="850" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Status</text>
      <text x="1000" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-transform="uppercase">Actions</text>

      <!-- Row 1 -->
      <path d="M 0 119 L 1136 119" stroke="#E2E8F0" stroke-width="1" fill="none" />
      <text x="24" y="90" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">LAP-001</text>
      <text x="200" y="90" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Laptop XPS 15</text>
      <text x="450" y="90" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">15</text>
      <text x="650" y="90" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">5</text>
      <rect x="850" y="74" width="70" height="24" rx="12" fill="#DCFCE7" />
      <text x="885" y="91" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16A34A" text-anchor="middle">In Stock</text>
      <rect x="1000" y="72" width="100" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
      <text x="1050" y="91" font-family="Inter, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Update Stock</text>

      <!-- Row 2 -->
      <path d="M 0 189 L 1136 189" stroke="#E2E8F0" stroke-width="1" fill="none" />
      <text x="24" y="160" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">WEB-001</text>
      <text x="200" y="160" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Webcam HD</text>
      <text x="450" y="160" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">2</text>
      <text x="650" y="160" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">5</text>
      <rect x="850" y="144" width="80" height="24" rx="12" fill="#FEF3C7" />
      <text x="890" y="161" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#D97706" text-anchor="middle">Low Stock</text>
      <rect x="1000" y="142" width="100" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
      <text x="1050" y="161" font-family="Inter, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Update Stock</text>

      <!-- Row 3 -->
      <path d="M 0 259 L 1136 259" stroke="#E2E8F0" stroke-width="1" fill="none" />
      <text x="24" y="230" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">SPK-001</text>
      <text x="200" y="230" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">Bluetooth Speaker</text>
      <text x="450" y="230" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">0</text>
      <text x="650" y="230" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">5</text>
      <rect x="850" y="214" width="90" height="24" rx="12" fill="#FEE2E2" />
      <text x="895" y="231" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#DC2626" text-anchor="middle">Out of Stock</text>
      <rect x="1000" y="212" width="100" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
      <text x="1050" y="231" font-family="Inter, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Update Stock</text>
    </g>
  </g>
</svg>
