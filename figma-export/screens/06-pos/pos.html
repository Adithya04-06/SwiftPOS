<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPOS - POS</title>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #F8FAFC; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 80px; background: #0F172A; color: #fff; padding: 24px 0; display: flex; flex-direction: column; align-items: center; }
        .sidebar .icon { width: 40px; height: 40px; background: #1E293B; border-radius: 8px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
        .sidebar .icon.active { background: #2563EB; }
        .main { flex: 1; display: flex; flex-direction: column; padding: 24px; box-sizing: border-box; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .search-bar { flex: 1; max-width: 400px; padding: 12px 16px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; overflow-y: auto; flex: 1; }
        .product-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
        .product-card:hover { border-color: #2563EB; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .product-img { height: 120px; background: #F1F5F9; border-radius: 8px; margin-bottom: 16px; }
        .product-title { font-weight: 600; color: #0F172A; font-size: 14px; margin-bottom: 4px; }
        .product-category { color: #64748B; font-size: 12px; margin-bottom: 8px; }
        .product-price { font-weight: bold; color: #2563EB; font-size: 16px; }
        
        .cart-panel { width: 400px; background: #fff; border-left: 1px solid #E2E8F0; display: flex; flex-direction: column; }
        .cart-header { padding: 24px; border-bottom: 1px solid #E2E8F0; font-size: 20px; font-weight: bold; color: #0F172A; }
        .cart-items { flex: 1; overflow-y: auto; padding: 24px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #F1F5F9; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: 500; color: #0F172A; font-size: 14px; margin-bottom: 4px; }
        .cart-item-price { color: #64748B; font-size: 14px; }
        .qty-controls { display: flex; align-items: center; gap: 12px; }
        .qty-btn { width: 28px; height: 28px; border: 1px solid #E2E8F0; border-radius: 4px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .cart-summary { padding: 24px; background: #F8FAFC; border-top: 1px solid #E2E8F0; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: #64748B; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px dashed #CBD5E1; font-size: 20px; font-weight: bold; color: #0F172A; }
        .checkout-btn { width: 100%; padding: 16px; background: #2563EB; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="icon" style="background:transparent; color:#fff; font-weight:bold;">S</div>
        <div class="icon">D</div>
        <div class="icon active">P</div>
        <div class="icon">I</div>
    </div>
    
    <div class="main">
        <div class="top-bar">
            <input type="text" class="search-bar" placeholder="Search products by name or SKU...">
            <div style="display:flex; gap:12px;">
                <button style="padding:8px 16px; background:#fff; border:1px solid #E2E8F0; border-radius:8px;">All Categories</button>
            </div>
        </div>
        
        <div class="product-grid">
            <div class="product-card">
                <div class="product-img"></div>
                <div class="product-title">Laptop XPS 15</div>
                <div class="product-category">Electronics</div>
                <div class="product-price">₹1,20,000</div>
            </div>
            <div class="product-card">
                <div class="product-img"></div>
                <div class="product-title">Wireless Mouse</div>
                <div class="product-category">Accessories</div>
                <div class="product-price">₹1,500</div>
            </div>
            <div class="product-card">
                <div class="product-img"></div>
                <div class="product-title">Mechanical Keyboard</div>
                <div class="product-category">Accessories</div>
                <div class="product-price">₹4,500</div>
            </div>
            <div class="product-card">
                <div class="product-img"></div>
                <div class="product-title">USB-C Cable</div>
                <div class="product-category">Accessories</div>
                <div class="product-price">₹500</div>
            </div>
        </div>
    </div>
    
    <div class="cart-panel">
        <div class="cart-header">Current Order</div>
        <div class="cart-items">
            <div class="cart-item">
                <div class="cart-item-info">
                    <div class="cart-item-title">Wireless Mouse</div>
                    <div class="cart-item-price">₹1,500</div>
                </div>
                <div class="qty-controls">
                    <button class="qty-btn">-</button>
                    <span>2</span>
                    <button class="qty-btn">+</button>
                </div>
                <div style="font-weight:bold; margin-left:16px;">₹3,000</div>
            </div>
            <div class="cart-item">
                <div class="cart-item-info">
                    <div class="cart-item-title">Mechanical Keyboard</div>
                    <div class="cart-item-price">₹4,500</div>
                </div>
                <div class="qty-controls">
                    <button class="qty-btn">-</button>
                    <span>1</span>
                    <button class="qty-btn">+</button>
                </div>
                <div style="font-weight:bold; margin-left:16px;">₹4,500</div>
            </div>
        </div>
        
        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span>₹7,500</span>
            </div>
            <div class="summary-row">
                <span>Tax (18%)</span>
                <span>₹1,350</span>
            </div>
            <div class="summary-total">
                <span>Total</span>
                <span>₹8,850</span>
            </div>
            <button class="checkout-btn">Checkout</button>
        </div>
    </div>
</body>
</html>
