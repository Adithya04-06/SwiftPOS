<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#F8FAFC" />
  
  <!-- Mini Sidebar -->
  <rect width="80" height="900" fill="#0F172A" />
  <text x="40" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">S</text>
  <rect x="20" y="80" width="40" height="40" rx="8" fill="#1E293B" />
  <rect x="20" y="140" width="40" height="40" rx="8" fill="#2563EB" />
  <rect x="20" y="200" width="40" height="40" rx="8" fill="#1E293B" />

  <!-- Main Area -->
  <g transform="translate(104, 24)">
    <rect width="400" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="16" y="27" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Search products by name or SKU...</text>
    
    <rect x="750" y="0" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="825" y="27" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">All Categories</text>
    
    <!-- Grid -->
    <g transform="translate(0, 70)">
      <!-- Product 1 -->
      <rect width="210" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="16" y="16" width="178" height="120" rx="8" fill="#F1F5F9" />
      <text x="16" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Laptop XPS 15</text>
      <text x="16" y="185" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Electronics</text>
      <text x="16" y="215" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">₹1,20,000</text>
      
      <!-- Product 2 -->
      <g transform="translate(230, 0)">
        <rect width="210" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="16" y="16" width="178" height="120" rx="8" fill="#F1F5F9" />
        <text x="16" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Wireless Mouse</text>
        <text x="16" y="185" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Accessories</text>
        <text x="16" y="215" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">₹1,500</text>
      </g>
      
      <!-- Product 3 -->
      <g transform="translate(460, 0)">
        <rect width="210" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="16" y="16" width="178" height="120" rx="8" fill="#F1F5F9" />
        <text x="16" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Mechanical Keyboard</text>
        <text x="16" y="185" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Accessories</text>
        <text x="16" y="215" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">₹4,500</text>
      </g>
      
      <!-- Product 4 -->
      <g transform="translate(690, 0)">
        <rect width="210" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="16" y="16" width="178" height="120" rx="8" fill="#F1F5F9" />
        <text x="16" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">USB-C Cable</text>
        <text x="16" y="185" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Accessories</text>
        <text x="16" y="215" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">₹500</text>
      </g>
    </g>
  </g>

  <!-- Cart Panel -->
  <g transform="translate(1040, 0)">
    <rect width="400" height="900" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="24" y="45" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Current Order</text>
    <rect width="400" height="1" fill="#E2E8F0" y="70" />
    
    <!-- Cart Items -->
    <g transform="translate(24, 94)">
      <text y="14" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Wireless Mouse</text>
      <text y="34" font-family="Inter, sans-serif" font-size="14" fill="#64748B">₹1,500</text>
      
      <rect x="220" y="0" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="234" y="19" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">-</text>
      <text x="264" y="19" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">2</text>
      <rect x="280" y="0" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="294" y="19" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">+</text>
      
      <text x="350" y="19" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="end">₹3,000</text>
      <rect width="352" height="1" fill="#F1F5F9" y="50" />
    </g>

    <g transform="translate(24, 168)">
      <text y="14" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Mechanical Keyboard</text>
      <text y="34" font-family="Inter, sans-serif" font-size="14" fill="#64748B">₹4,500</text>
      
      <rect x="220" y="0" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="234" y="19" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">-</text>
      <text x="264" y="19" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">1</text>
      <rect x="280" y="0" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="294" y="19" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">+</text>
      
      <text x="350" y="19" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="end">₹4,500</text>
      <rect width="352" height="1" fill="#F1F5F9" y="50" />
    </g>

    <!-- Summary -->
    <rect y="640" width="400" height="260" fill="#F8FAFC" />
    <rect width="400" height="1" fill="#E2E8F0" y="640" />
    
    <text x="24" y="680" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Subtotal</text>
    <text x="376" y="680" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="end">₹7,500</text>
    
    <text x="24" y="710" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Tax (18%)</text>
    <text x="376" y="710" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" text-anchor="end">₹1,350</text>
    
    <rect x="24" y="730" width="352" height="1" fill="#CBD5E1" stroke-dasharray="4" />
    
    <text x="24" y="770" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Total</text>
    <text x="376" y="770" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="end">₹8,850</text>
    
    <rect x="24" y="800" width="352" height="56" rx="8" fill="#2563EB" />
    <text x="200" y="834" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Checkout</text>
  </g>
</svg>
