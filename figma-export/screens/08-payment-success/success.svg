<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="rgba(15, 23, 42, 0.5)" />
  
  <g transform="translate(480, 150)">
    <rect width="480" height="520" rx="12" fill="#FFFFFF" />
    
    <!-- Icon -->
    <circle cx="240" cy="100" r="40" fill="#DCFCE7" />
    <path d="M 225 100 L 235 110 L 255 90" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Text -->
    <text x="240" y="180" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Payment Successful</text>
    <text x="240" y="210" font-family="Inter, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">The transaction has been completed successfully.</text>
    
    <!-- Details Box -->
    <rect x="40" y="250" width="400" height="120" rx="8" fill="#F8FAFC" />
    
    <text x="60" y="285" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Transaction ID</text>
    <text x="420" y="285" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A" text-anchor="end">#TRX-8924</text>
    
    <text x="60" y="320" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Amount</text>
    <text x="420" y="320" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="end">₹8,850</text>
    
    <text x="60" y="355" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Payment Method</text>
    <text x="420" y="355" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A" text-anchor="end">Cash</text>
    
    <!-- Buttons -->
    <rect x="40" y="410" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="135" y="441" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">New Sale</text>
    
    <rect x="250" y="410" width="190" height="52" rx="8" fill="#2563EB" />
    <text x="345" y="441" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">View Receipt</text>
  </g>
</svg>
